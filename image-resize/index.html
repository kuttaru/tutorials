<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Image Crop Tool (960x1200)</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>

<style>

body{
font-family: Arial, sans-serif;
background:#eef2f7;
margin:0;
padding:40px;
display:flex;
justify-content:center;
}

.app{
width:900px;
background:white;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
padding:25px;
}

h2{
text-align:center;
margin-bottom:20px;
}

.workspace{
display:flex;
gap:20px;
}

.editor{
flex:2;
}

.preview{
flex:1;
background:#f5f5f5;
border-radius:10px;
padding:10px;
text-align:center;
}

.preview canvas{
max-width:100%;
}

#dropArea{
border:2px dashed #bbb;
padding:30px;
border-radius:10px;
text-align:center;
margin-bottom:15px;
cursor:pointer;
}

#dropArea.dragover{
border-color:#007bff;
background:#f0f7ff;
}

img{
max-width:100%;
}

.controls{
margin-top:15px;
}

.control-group{
margin-bottom:10px;
}

label{
display:block;
font-size:14px;
margin-bottom:4px;
}

input[type=range]{
width:100%;
}

.buttons{
margin-top:15px;
}

button{
padding:10px 14px;
border:none;
background:#007bff;
color:white;
border-radius:6px;
cursor:pointer;
margin-right:6px;
}

button:hover{
background:#0056b3;
}

</style>
</head>

<body>

<div class="app">

<h2>Advanced Image Crop Tool (960 × 1200)</h2>

<div id="dropArea">Drop Image Here or Click to Upload</div>
<input type="file" id="upload" accept="image/*" style="display:none">

<div class="workspace">

<div class="editor">

<img id="image">

<div class="controls">

<div class="control-group">
<label>Zoom</label>
<input type="range" id="zoom" min="0.1" max="3" step="0.01" value="1">
</div>

<div class="control-group">
<label>Rotate</label>
<input type="range" id="rotate" min="-180" max="180" step="1" value="0">
</div>

<div class="buttons">
<button id="reset">Reset</button>
<button id="download">Download</button>
</div>

</div>

</div>

<div class="preview">
<h4>Preview</h4>
<canvas id="previewCanvas" width="240" height="300"></canvas>
</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>

let cropper;

const image = document.getElementById("image");
const upload = document.getElementById("upload");
const dropArea = document.getElementById("dropArea");

const previewCanvas = document.getElementById("previewCanvas");
const previewCtx = previewCanvas.getContext("2d");

dropArea.addEventListener("click",()=>upload.click());

upload.addEventListener("change",e=>{
loadImage(e.target.files[0]);
});

dropArea.addEventListener("dragover",e=>{
e.preventDefault();
dropArea.classList.add("dragover");
});

dropArea.addEventListener("dragleave",()=>{
dropArea.classList.remove("dragover");
});

dropArea.addEventListener("drop",e=>{
e.preventDefault();
dropArea.classList.remove("dragover");
loadImage(e.dataTransfer.files[0]);
});

function loadImage(file){

const url = URL.createObjectURL(file);
image.src = url;

if(cropper){
cropper.destroy();
}

image.onload = ()=>{

cropper = new Cropper(image,{
aspectRatio:960/1200,
viewMode:1,
dragMode:'move',
autoCropArea:1,
responsive:true,
rotatable:true,
zoomable:true,
crop:updatePreview
});

};

}

function updatePreview(){

if(!cropper) return;

const canvas = cropper.getCroppedCanvas({
width:240,
height:300
});

previewCtx.clearRect(0,0,240,300);
previewCtx.drawImage(canvas,0,0);

}

document.getElementById("zoom").addEventListener("input",function(){
if(cropper) cropper.zoomTo(this.value);
});

document.getElementById("rotate").addEventListener("input",function(){
if(cropper) cropper.rotateTo(this.value);
});

document.getElementById("reset").addEventListener("click",()=>{
if(cropper) cropper.reset();
});

document.getElementById("download").addEventListener("click",()=>{

if(!cropper) return;

const canvas = cropper.getCroppedCanvas({
width:960,
height:1200
});

const link = document.createElement("a");
link.download="cropped-image.jpg";
link.href=canvas.toDataURL("image/jpeg",0.95);
link.click();

});

</script>

</body>
</html>
