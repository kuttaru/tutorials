<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Crop (960x1200)</title>

<link href="style.css" rel="stylesheet"/>


</head>

<body>

<div class="app">
	<h2>Image Crop (960 × 1200)</h2>
	<div id="dropArea">Drop Image Here or Click to Upload</div>
	<input type="file" id="upload" accept="image/*" style="display:none">
	<div class="workspace">
		<div class="img-wrap">
			<div class="editor">
				<img id="image">
				<img id="watermark" src="logo.svg">
			</div>
		</div>
		<div class="preview">
			<canvas id="previewCanvas" width="240" height="300"></canvas>
			<div class="controls">
				<div class="control-group">
					<label>Zoom</label>
					<input type="range" id="zoom" min="0.1" max="3" step="0.01" value="1">
				</div>
				<div class="control-group">
					<label>Rotate</label>
					<input type="range" id="rotate" min="-180" max="180" step="1" value="0">
				</div>

				<div class="control-group">
				<label>Watermark Scale</label>
				<input type="range" id="wmScale" min="0.2" max="2" step="0.1" value="1">
				</div>

				<div class="control-group">
				<label>Watermark Opacity</label>
				<input type="range" id="wmOpacity" min="0" max="1" step="0.05" value="0.6">
				</div>


				<div class="buttons">
					<button id="reset">Reset</button>
					<button id="download">Download</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script src="cropper.min.js"></script>

<script>

let cropper;

const image = document.getElementById("image");
const upload = document.getElementById("upload");
const dropArea = document.getElementById("dropArea");

const previewCanvas = document.getElementById("previewCanvas");
const previewCtx = previewCanvas.getContext("2d");

const watermark = document.getElementById("watermark");
const editor = document.querySelector(".editor");

let wmX = 20;
let wmY = 20;

/* -----------------------
UPLOAD
-----------------------*/

dropArea.onclick = () => upload.click();

upload.onchange = e => loadImage(e.target.files[0]);

dropArea.ondrop = e =>{
e.preventDefault();
loadImage(e.dataTransfer.files[0]);
};

dropArea.ondragover = e => e.preventDefault();

function loadImage(file){

const url = URL.createObjectURL(file);
image.src = url;

if(cropper) cropper.destroy();

image.onload = ()=>{

cropper = new Cropper(image,{
aspectRatio:960/1200,
viewMode:1,
dragMode:'move',
autoCropArea:1,
crop:updatePreview
});

};

}

/* -----------------------
WATERMARK DRAG
-----------------------*/

let dragging=false;
let startX,startY;

watermark.onmousedown = e=>{

dragging=true;

startX = e.clientX - wmX;
startY = e.clientY - wmY;

};

document.onmousemove = e=>{

if(!dragging) return;

wmX = e.clientX - startX;
wmY = e.clientY - startY;

watermark.style.left = wmX + "px";
watermark.style.top = wmY + "px";

updatePreview();

};

document.onmouseup = ()=> dragging=false;


/* -----------------------
SCALE
-----------------------*/

document.getElementById("wmScale").oninput=function(){

watermark.style.transform="scale("+this.value+")";
updatePreview();

};

/* -----------------------
OPACITY
-----------------------*/

document.getElementById("wmOpacity").oninput=function(){

watermark.style.opacity=this.value;
updatePreview();

};


/* -----------------------
ZOOM
-----------------------*/

zoom.oninput=function(){
if(cropper) cropper.zoomTo(this.value);
};


/* -----------------------
ROTATE
-----------------------*/

rotate.oninput=function(){
if(cropper) cropper.rotateTo(this.value);
};


/* -----------------------
PREVIEW
-----------------------*/

function updatePreview(){

if(!cropper) return;

const canvas = cropper.getCroppedCanvas({
width:240,
height:300
});

previewCtx.clearRect(0,0,240,300);
previewCtx.drawImage(canvas,0,0);


/* draw watermark */

const wm = new Image();
wm.src = watermark.src;

wm.onload = ()=>{

const scale = 240 / editor.offsetWidth;

const drawX = wmX * scale;
const drawY = wmY * scale;

const drawW = watermark.offsetWidth * scale;
const drawH = watermark.offsetHeight * scale;

previewCtx.globalAlpha = watermark.style.opacity || 0.6;

previewCtx.drawImage(wm,drawX,drawY,drawW,drawH);

};

}


/* -----------------------
DOWNLOAD
-----------------------*/

download.onclick = ()=>{

if(!cropper) return;

const canvas = cropper.getCroppedCanvas({
width:960,
height:1200
});

const ctx = canvas.getContext("2d");

const wm = new Image();
wm.src = watermark.src;

wm.onload = ()=>{

const scale = 960 / editor.offsetWidth;

const drawX = wmX * scale;
const drawY = wmY * scale;

const drawW = watermark.offsetWidth * scale;
const drawH = watermark.offsetHeight * scale;

ctx.globalAlpha = watermark.style.opacity || 0.6;

ctx.drawImage(wm,drawX,drawY,drawW,drawH);

const link = document.createElement("a");
link.download="cropped-image.jpg";
link.href = canvas.toDataURL("image/jpeg",0.95);
link.click();

};

};


/* -----------------------
RESET
-----------------------*/

reset.onclick=()=>{

if(cropper) cropper.reset();

wmX=20;
wmY=20;

watermark.style.left="20px";
watermark.style.top="20px";

updatePreview();

};

</script>

</body>
</html>
